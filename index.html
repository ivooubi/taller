<!doctype html><html lang="es"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  <title>Taller Ruedas</title>  <meta name="description" content="Taller de coches. Cuéntanos qué le pasa al tuyo y nos encargamos.">  <meta name="theme-color" content="#1a1c1f">
  <link rel="preconnect" href="https://fonts.googleapis.com">  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>    /* ---------- Variables ---------- */    :root {      --asphalt: #1a1c1f;   /* fondo base y velo sobre la foto */      --band:    #202327;   /* franja de fondo alterna */      --panel:   #272a2f;   /* tarjetas y chat */      --paint:   #ffffff;   /* blanco de pintura vial: texto y contorno */      --muted:   #b4b9bf;      --line:    rgb(255 255 255 / .14);      --signal:  #f5c400;   /* amarillo de chaleco reflectante: único acento */      --ink:     #16181b;   /* texto sobre el amarillo */      --open:    #5ccf7a;   /* punto de "abierto" */      --header-h: 4.5rem;      --pad:     clamp(1.25rem, 5vw, 4rem);      --font:    "Montserrat", system-ui, sans-serif;

      /* Foto: cambia aquí qué parte de la imagen queda visible */      --hero-pos: 70% center;    }
    /* ---------- Base ---------- */    *, *::before, *::after { box-sizing: border-box; }    [hidden] { display: none !important; }    html {      scroll-behavior: smooth;      scroll-padding-top: var(--header-h);      -webkit-text-size-adjust: 100%;    }    body {      margin: 0;      background: var(--asphalt);      color: var(--paint);      font-family: var(--font);      font-weight: 500;      line-height: 1.5;    }    a { color: inherit; }    :focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }    .sr-only {      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;    }
    /* ---------- Cabecera fija ---------- */    .site-header {      position: fixed;      inset: 0 0 auto 0;      z-index: 20;      display: flex;      align-items: center;      gap: 2rem;      height: calc(var(--header-h) + env(safe-area-inset-top));      padding: env(safe-area-inset-top) var(--pad) 0;      transition: background-color .25s, box-shadow .25s;    }    .site-header.is-solid {      background: rgb(26 28 31 / .95);      box-shadow: 0 1px 0 var(--line);    }    .brand {      margin-right: auto;      font-size: 1.4rem;      font-weight: 800;      text-transform: uppercase;      text-decoration: none;    }    .nav { display: flex; align-items: center; gap: 2rem; }    .nav__link {      padding: .4rem 0;      border-bottom: 2px solid transparent;      font-weight: 600;      letter-spacing: .04em;      text-transform: uppercase;      text-decoration: none;      transition: border-color .2s;    }    .nav__link:hover,    .nav__link[aria-current="true"] { border-color: var(--signal); }
    .menu-toggle {      display: none;      position: relative;      width: 2.75rem;      height: 2.75rem;      margin-right: -.5rem;      padding: 0;      border: 0;      background: none;      color: inherit;      cursor: pointer;    }    .menu-toggle__bars,    .menu-toggle__bars::before,    .menu-toggle__bars::after {      position: absolute;      width: 1.5rem;      height: 2px;      background: currentColor;      transition: transform .2s, background-color .2s;    }    .menu-toggle__bars { top: 50%; left: 50%; margin: -1px 0 0 -.75rem; }    .menu-toggle__bars::before,    .menu-toggle__bars::after { content: ""; left: 0; }    .menu-toggle__bars::before { top: -7px; }    .menu-toggle__bars::after  { top: 7px; }    .menu-toggle[aria-expanded="true"] .menu-toggle__bars { background: transparent; }    .menu-toggle[aria-expanded="true"] .menu-toggle__bars::before { transform: translateY(7px) rotate(45deg); }    .menu-toggle[aria-expanded="true"] .menu-toggle__bars::after  { transform: translateY(-7px) rotate(-45deg); }
    /* ---------- Botones y enlaces ---------- */    .btn {      display: inline-flex;      align-items: center;      justify-content: center;      min-height: 3rem;      padding: .7rem 1.5rem;      border: 2px solid transparent;      border-radius: .25rem;      font: 600 1.0625rem/1 var(--font);      letter-spacing: .03em;      text-transform: uppercase;      text-decoration: none;      cursor: pointer;      transition: background-color .15s, color .15s, border-color .15s, transform .15s;    }    .btn:active { transform: translateY(1px); }    .btn:disabled { opacity: .55; cursor: not-allowed; }    .btn--signal { background: var(--signal); color: var(--ink); }    .btn--signal:hover:not(:disabled) { background: #ffd324; }    .btn--ghost { border-color: var(--paint); background: transparent; color: var(--paint); }    .btn--ghost:hover { background: var(--paint); color: var(--ink); }    .btn--small { min-height: 2.5rem; padding: .5rem 1.1rem; font-size: 1rem; }
    .nav__cta { display: none; }
    .link {      font-weight: 600;      font-size: 1.0625rem;      letter-spacing: .03em;      text-transform: uppercase;      text-decoration: underline;      text-decoration-color: var(--signal);      text-decoration-thickness: 2px;      text-underline-offset: .35em;    }
    .actions {      display: flex;      flex-wrap: wrap;      align-items: center;      gap: 1rem 1.75rem;      margin-top: clamp(1.75rem, 3.5vw, 2.75rem);    }
    /* ---------- Hero ---------- */    .hero {      position: relative;      isolation: isolate;      display: flex;      align-items: center;      min-height: 100vh;      min-height: 100svh;      padding: calc(var(--header-h) + 2rem) var(--pad) 5rem;      /* Si img/hero.jpg no existe, se ve el degradado gris de la segunda capa */      background:url("hero.jpeg") var(--hero-pos) / cover no-repeat,        radial-gradient(120% 90% at 80% 40%, #3b4047 0%, var(--asphalt) 62%);    }    /* Velo oscuro a la izquierda para que el contorno blanco se lea sobre la foto */    .hero::before {      content: "";      position: absolute;      inset: 0;      z-index: -1;      background:        linear-gradient(90deg, rgb(26 28 31 / .9) 0%, rgb(26 28 31 / .65) 42%, rgb(26 28 31 / .1) 78%),        linear-gradient(0deg, rgb(26 28 31 / .6), transparent 28%);    }    .hero__copy { max-width: 56rem; }
    /* Texto solo contorno */    .outline {      margin: 0;      color: transparent;      text-transform: uppercase;      -webkit-text-stroke: var(--stroke, 2px) var(--paint);    }    @supports not (-webkit-text-stroke: 1px #fff) {      .outline { color: var(--paint); }    }
    .headline {      --stroke: clamp(1.25px, .25vw + .75px, 2.25px);      font-size: clamp(2.5rem, 8.5vw + .5rem, 6.25rem);      font-weight: 800;      line-height: .98;      letter-spacing: .01em;    }    /* Cada línea es una máscara para la entrada; el padding evita recortar el trazo */    .line {      display: block;      overflow: hidden;      padding: .08em .06em .14em;      margin: -.08em -.06em -.14em;    }    .line > span { display: block; }
    .tagline {      --stroke: 1.1px;      max-width: 20em;      margin-top: clamp(1.25rem, 2.5vw, 2rem);      font-size: clamp(1.25rem, 2.2vw + .5rem, 2.25rem);      font-weight: 800;      line-height: 1.15;      letter-spacing: .02em;      text-wrap: balance;    }
    /* Línea discontinua de carretera */    .road {      position: absolute;      left: var(--pad);      right: 0;      bottom: clamp(1.25rem, 3vh, 2rem);      height: 4px;      background: repeating-linear-gradient(90deg, var(--signal) 0 2.5rem, transparent 2.5rem 4.5rem);      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 55%, transparent 100%);              mask-image: linear-gradient(90deg, #000 0%, #000 55%, transparent 100%);    }
    /* ---------- Secciones ---------- */    .section { padding: clamp(4rem, 9vw, 7rem) var(--pad); }    .section--alt { background: var(--band); }    .section__inner { max-width: 72rem; margin-inline: auto; }    .section__head {      display: flex;      flex-wrap: wrap;      align-items: flex-end;      justify-content: space-between;      gap: 1rem 2rem;    }    .section__title {      margin: 0;      font-size: clamp(2rem, 4.5vw + .5rem, 3.75rem);      font-weight: 800;      line-height: 1;      letter-spacing: .01em;      text-transform: uppercase;    }    .lead { max-width: 32rem; margin: 1rem 0 0; font-size: 1.1875rem; color: var(--muted); }    .lead a { color: var(--paint); text-decoration-color: var(--signal); text-underline-offset: .25em; white-space: nowrap; }    .note { max-width: 40rem; margin: 1rem 0 0; color: var(--muted); }
    .split {      display: grid;      grid-template-columns: minmax(0, 1fr);      gap: clamp(2rem, 5vw, 4rem);      align-items: start;    }    @media (min-width: 900px) {      .split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }    }
    /* Estado abierto / cerrado */    .status { display: flex; align-items: center; gap: .6rem; margin: 1rem 0 0; color: var(--muted); }    .status__dot { flex: none; width: .65rem; height: .65rem; border-radius: 50%; background: #8a9097; }    .status[data-abierto="true"] .status__dot { background: var(--open); }    .status[data-abierto="true"] { color: var(--paint); }
    /* Ubicación */    .address { margin: 1.5rem 0 0; font-size: 1.25rem; font-style: normal; line-height: 1.35; }    .hours { display: grid; margin: 1.25rem 0 0; }    .hours__row {      display: flex;      justify-content: space-between;      gap: 1rem;      padding: .65rem 0;      border-bottom: 1px solid var(--line);    }    .hours__row dt { font-weight: 600; }    .hours__row dd { margin: 0; color: var(--muted); text-align: right; }    .map {      height: clamp(18rem, 45vw, 30rem);      overflow: hidden;      border: 1px solid var(--line);      border-radius: .25rem;      background: #2a2e33;    }    .map iframe {      display: block;      width: 100%;      height: 100%;      border: 0;      filter: grayscale(1) invert(.9) contrast(.9);    }
    /* ---------- Carrusel de reseñas ---------- */    .carousel {      overflow: hidden;      margin-top: 2.5rem;      -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);              mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);    }    .carousel__track {      display: flex;      gap: 1rem;      width: max-content;      margin: 0;      padding: 0 1rem 0 0;      list-style: none;    }    .carousel:hover .carousel__track,    .carousel.is-paused .carousel__track { animation-play-state: paused; }
    .review {      display: flex;      flex: 0 0 20rem;      flex-direction: column;      gap: .9rem;      padding: 1.25rem;      border: 1px solid var(--line);      border-radius: .25rem;      background: var(--panel);    }    .review__stars { display: flex; gap: .15rem; }    .review__text { margin: 0; font-size: 1.0625rem; line-height: 1.45; }    .review__who {      display: flex;      align-items: center;      justify-content: space-between;      gap: .75rem;      margin-top: auto;      font-weight: 600;    }    .tag {      padding: .1rem .45rem;      border: 1px solid var(--muted);      border-radius: .2rem;      font-size: .75rem;      font-weight: 600;      letter-spacing: .06em;      text-transform: uppercase;      color: var(--muted);    }
    /* ---------- Chat ---------- */    .chat {      display: flex;      flex-direction: column;      height: min(34rem, 80vh);      height: min(34rem, 80svh);      overflow: hidden;      border: 1px solid var(--line);      border-radius: .25rem;      background: var(--panel);    }    .chat__demo {      margin: 0;      padding: .6rem 1rem;      border-bottom: 1px solid var(--line);      background: rgb(245 196 0 / .12);      color: var(--signal);      font-size: .9375rem;    }    .chat__start { display: flex; flex: 1; align-items: center; justify-content: center; padding: 1.5rem; }    .chat__start-form { display: grid; gap: .9rem; width: min(100%, 24rem); }    .chat__subtitle { margin: 0; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }    .chat__start-form label { font-weight: 600; }    .fineprint { margin: 0; font-size: .875rem; color: var(--muted); }
    .chat__conv { display: flex; flex: 1; flex-direction: column; min-height: 0; }    .chat__bar {      display: flex;      flex-wrap: wrap;      align-items: baseline;      justify-content: space-between;      gap: .25rem 1rem;      padding: .8rem 1rem;      border-bottom: 1px solid var(--line);    }    .chat__bar-title { font-weight: 800; text-transform: uppercase; }    .chat__bar-sub { color: var(--muted); font-size: .9375rem; }
    .chat__log {      display: flex;      flex: 1;      flex-direction: column;      gap: .5rem;      min-height: 0;      margin: 0;      padding: 1rem;      overflow-y: auto;      overscroll-behavior: contain;      list-style: none;    }    .msg {      display: flex;      flex-direction: column;      gap: .2rem;      max-width: 82%;      padding: .6rem .8rem;      border-radius: .5rem;    }    .msg--cliente { align-self: flex-end; background: var(--signal); color: var(--ink); border-bottom-right-radius: .15rem; }    .msg--taller  { align-self: flex-start; background: #343840; border-bottom-left-radius: .15rem; }    .msg--nota {      align-self: center;      max-width: 92%;      padding: .25rem;      background: none;      color: var(--muted);      font-size: .9375rem;      text-align: center;    }    .msg__texto { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }    .msg__hora { align-self: flex-end; font-size: .75rem; opacity: .7; }
    .chat__composer {      display: flex;      align-items: flex-end;      gap: .5rem;      padding: .75rem;      border-top: 1px solid var(--line);    }    .field {      width: 100%;      min-height: 3rem;      padding: .7rem .9rem;      border: 1px solid var(--line);      border-radius: .25rem;      background: var(--asphalt);      color: var(--paint);      font: 500 1rem/1.4 var(--font);    }    .chat__composer .field { flex: 1; max-height: 9rem; resize: none; }    .chat__aviso { margin: 0; padding: 0 1rem .75rem; color: #ffb4a8; font-size: .9375rem; }    .chat__aviso:empty { display: none; }
    .footer {      display: flex;      flex-wrap: wrap;      justify-content: space-between;      gap: .5rem 1.5rem;      padding: 1.5rem var(--pad);      border-top: 1px solid var(--line);      color: var(--muted);      font-size: .9375rem;    }    .footer p { margin: 0; }
    /* ---------- Entrada del hero (una sola secuencia al cargar) ---------- */    @media (prefers-reduced-motion: no-preference) {      .line > span {        transform: translateY(105%);        animation: rise .9s cubic-bezier(.16, .84, .3, 1) forwards;      }      .line:nth-child(2) > span { animation-delay: .12s; }      .hero .tagline { animation: fade .8s .55s both; }      .hero .actions { animation: fade .8s .75s both; }

      .carousel__track { animation: scroll var(--dur, 60s) linear infinite; }    }    @keyframes rise { to { transform: none; } }    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }    @keyframes scroll { to { transform: translateX(-50%); } }
    /* Con movimiento reducido el carrusel no gira: se desliza con el dedo o el teclado */    @media (prefers-reduced-motion: reduce) {      html { scroll-behavior: auto; }      .carousel {        overflow-x: auto;        -webkit-mask-image: none;                mask-image: none;      }      .carousel [data-clon], #carrusel-pausa { display: none; }    }
    /* ---------- Móvil ---------- */    @media (max-width: 800px) {      .menu-toggle { display: block; }      .header__cta { display: none; }      .nav {        position: fixed;        top: calc(var(--header-h) + env(safe-area-inset-top));        left: 0;
        right: 0;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: .5rem var(--pad) 1.5rem;
        border-bottom: 1px solid var(--line);
        background: var(--asphalt);
      }
      .nav.is-open { display: flex; }
      .nav__link { padding: 1rem 0; border-bottom: 1px solid var(--line); font-size: 1.25rem; }
      .nav__cta { display: inline-flex; margin-top: 1.25rem; }
      .hero::before {
        background: linear-gradient(180deg, rgb(26 28 31 / .55), rgb(26 28 31 / .8));
      }
    }  </style></head>
<body>  <header class="site-header" id="cabecera">    <a class="brand" href="#inicio">Taller Ruedas</a>    <nav class="nav" id="menu" aria-label="Principal">      <a class="nav__link" href="#ubicacion">Ubicación</a>      <a class="nav__link" href="#resenas">Reseñas</a>      <a class="nav__link" href="#chat">Chat</a>      <a class="btn btn--signal nav__cta" href="#chat" data-abrir-chat>Escribir al taller</a>    </nav>    <a class="btn btn--signal btn--small header__cta" href="#chat" data-abrir-chat>Escribir al taller</a>    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">      <span class="sr-only">Menú</span>      <span class="menu-toggle__bars" aria-hidden="true"></span>    </button>  </header>

  <main>    <!-- ================= INICIO ================= -->    <section class="hero" id="inicio">      <div class="hero__copy">        <h1 class="outline headline">          <span class="line"><span>¿Todo va</span></span>          <span class="line"><span>sobre ruedas?</span></span>        </h1>        <p class="outline tagline">Si no es así, nosotros nos encargamos</p>        <div class="actions">          <a class="btn btn--signal" href="#chat" data-abrir-chat>Escribir al taller</a>          <a class="link" href="#ubicacion">Ver dónde estamos</a>        </div>      </div>      <div class="road" aria-hidden="true"></div>    </section>

    <!-- ================= UBICACIÓN ================= -->
    <section class="section" id="ubicacion" aria-labelledby="ubicacion-titulo">
      <div class="section__inner split">
        <div>
          <h2 class="section__title" id="ubicacion-titulo">Dónde estamos</h2>
          <p class="status" data-estado role="status">
            <span class="status__dot" aria-hidden="true"></span>
            <span class="status__texto"></span>
          </p>
          <address class="address" id="direccion"></address>
          <dl class="hours" id="horario"></dl>
          <div class="actions">
            <a class="btn btn--signal" id="btn-ruta" href="#" target="_blank" rel="noopener">Cómo llegar</a>
            <a class="btn btn--ghost" href="#" data-telefono>Llamar</a>
          </div>
        </div>
        <div class="map">
          <iframe id="mapa" title="Mapa con la ubicación del taller" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>

    <!-- ================= RESEÑAS ================= -->
    <section class="section section--alt" id="resenas" aria-labelledby="resenas-titulo">
      <div class="section__inner">
        <div class="section__head">
          <h2 class="section__title" id="resenas-titulo">Opiniones</h2>
          <button class="btn btn--ghost btn--small" id="carrusel-pausa" type="button">Pausar</button>
        </div>
        <p class="note"
